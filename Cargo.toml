[package]
name = "ferris_notify"
version = "0.1.0"
edition = "2021"


[dependencies]
anyhow = "1.0.97"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.1", features = ["macros"] }
axum-extra = { version = "0.10.1", features = ["typed-header","cookie"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
config = "0.15.7"
rand = { version = "0.9.0", features = ["std_rng"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-redis-store = { version = "0.16.0", features = ["enable-rustls"] }
tracing = "0.1.41"
tracing-bunyan-formatter = "0.3.10"
tracing-subscriber = { version = "0.3.19", features = ["registry","env-filter"] }
unicode-segmentation = "1.12.0"
uuid = { version = "1.13.1", features = ["v4", "serde"] }
validator = "0.20.0"
rand2 = { package = "rand", version = "0.8", features = ["std_rng"] }
tower = "0.5.2"
serde_json = "1.0.140"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
"runtime-tokio",
"tls-rustls",
"macros",
"postgres",
"uuid",
"chrono",
"migrate",
"json"
]

[dependencies.reqwest]
version = "0.12.12"
default-features = false
features = ["json", "rustls-tls","cookies"]

[dev-dependencies]
claims = "0.8.0"
fake = "4.0.0"
linkify = "0.10.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
wiremock = "0.6.3"
# reqwest = "0.12.12"

